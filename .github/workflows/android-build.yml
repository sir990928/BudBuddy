name: Android CI/CD

on:
  push:
    branches: [ "staging", "master" ]
  pull_request:
    branches: [ "dev", "staging", "master" ]

jobs:
  policy:
    name: PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion workflow
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.base_ref }}" == "staging" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "::error::Pull requests to 'staging' from external forks are not allowed."
              exit 1
            fi

            if [[ "${{ github.head_ref }}" != "dev" ]]; then
              echo "::error::Pull requests to 'staging' MUST originate from the 'dev' branch."
              exit 1
            fi
          fi

          if [[ "${{ github.base_ref }}" == "master" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "::error::Pull requests to 'master' from external forks are not allowed."
              exit 1
            fi

            if [[ "${{ github.head_ref }}" != "staging" ]]; then
              echo "::error::Pull requests to 'master' MUST originate from the 'staging' branch."
              exit 1
            fi
          fi

          echo "Branch promotion policy passed."

  build:
    needs: policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Chinese locale resources
        run: |
          if [[ ! -f "app/src/main/res/values-zh-rCN/strings.xml" ]]; then
            echo "::error::Chinese locale file not found at app/src/main/res/values-zh-rCN/strings.xml"
            exit 1
          fi
          echo "Chinese locale resource verified."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ================= Dev =================
      - name: Build Debug APK (Dev)
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        run: ./gradlew assembleGithubDebug

      - name: Upload Debug APK (Dev)
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-dev
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      # ================= Staging =================
      - name: Build Debug APK (Staging)
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        run: ./gradlew assembleGithubDebug

      - name: Upload Debug APK (Staging)
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Decode Staging Keystore
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        env:
          STAGING_KEYSTORE_BASE64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
        run: |
          echo "$STAGING_KEYSTORE_BASE64" | base64 --decode > staging-keystore.jks

      - name: Build Unsigned Release APK (Staging)
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        run: ./gradlew assembleGithubRelease

      - name: Sign Staging Release APK
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        env:
          STAGING_KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          STAGING_KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
          STAGING_STORE_PASSWORD: ${{ secrets.STAGING_STORE_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/github/release/app-github-release*.apk | grep -v aligned | head -1)
          ALIGNED_APK="${APK%.apk}-aligned.apk"

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort | tail -1)
          echo "zipalign: $ZIPALIGN"
          $ZIPALIGN -v -p 4 "$APK" "$ALIGNED_APK"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          $APKSIGNER sign \
            --ks staging-keystore.jks \
            --ks-pass pass:"$STAGING_STORE_PASSWORD" \
            --ks-key-alias "$STAGING_KEY_ALIAS" \
            --key-pass pass:"$STAGING_KEY_PASSWORD" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$ALIGNED_APK"

          $APKSIGNER verify --verbose "$ALIGNED_APK"

          rm -f "$APK"
          mv "$ALIGNED_APK" "$APK"
          echo "Staging release APK signed."

      - name: Upload Staging Release APK
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-release
          path: app/build/outputs/apk/github/release/app-github-release*.apk

      # ================= Master =================
      - name: Decode Keystore (Master)
        if: >
          github.ref == 'refs/heads/master' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'master' &&
            github.head_ref == 'staging' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build Unsigned Release APK (Master)
        if: >
          github.ref == 'refs/heads/master' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'master' &&
            github.head_ref == 'staging' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        run: ./gradlew assembleGithubRelease

      - name: Sign Master Release APK
        if: >
          github.ref == 'refs/heads/master' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'master' &&
            github.head_ref == 'staging' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/github/release/app-github-release*.apk | grep -v aligned | head -1)
          ALIGNED_APK="${APK%.apk}-aligned.apk"

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort | tail -1)
          echo "zipalign: $ZIPALIGN"
          $ZIPALIGN -v -p 4 "$APK" "$ALIGNED_APK"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-pass pass:"$SIGNING_STORE_PASSWORD" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass pass:"$SIGNING_KEY_PASSWORD" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$ALIGNED_APK"

          $APKSIGNER verify --verbose "$ALIGNED_APK"

          rm -f "$APK"
          mv "$ALIGNED_APK" "$APK"
          echo "Master release APK signed."

      - name: Upload Release APK
        if: >
          github.ref == 'refs/heads/master' ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'master' &&
            github.head_ref == 'staging' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/github/release/app-github-release*.apk

      - name: Clean up keystores
        if: always()
        run: rm -f staging-keystore.jks keystore.jks